name: Trivy image scan

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/trivy-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/trivy-scan.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build demo app image
        run: docker build -t tenant-lab/notes-api:${{ github.sha }} app/

      # Gate: fails the job (and therefore the PR check) on any HIGH or CRITICAL
      # vulnerability with a known fix available. This is the "basic CI/CD security gate"
      # from the proposal — a static, pre-deploy check, independent of everything the
      # in-cluster monitors do at runtime.
      #
      # No SARIF-upload-to-Security-tab step here: that requires GitHub Advanced Security,
      # which isn't available for private repos without a paid plan — the table-format gate
      # above is the actual requirement (fail the build), and doesn't need it.
      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tenant-lab/notes-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
