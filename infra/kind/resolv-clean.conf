# Clean upstream resolv.conf for kubelet on every kind node (see docs/risk-log.md #11).
#
# Docker injects the HOST's own DNS search domain into each kind node's /etc/resolv.conf
# (Docker Engine copies /etc/resolv.conf's `search` line into the container's embedded-DNS
# config). Kubelet then propagates that search domain into every pod's resolv.conf per
# https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/ ("Docker
# generates a new /etc/resolv.conf... kubelet copies the DNS search list from that file into
# every pod"). If that inherited domain has a permissive/wildcard DNS record (e.g. a campus or
# corporate network's search domain answering any name), short in-cluster names with fewer
# dots than `ndots` (default 5) — like `hubble-peer.kube-system.svc.cluster.local` — can get
# resolved to the wrong address before the real cluster-local answer is ever tried.
#
# This file has no `search` line at all, so kubelet has nothing external to propagate. The
# nameserver below is Docker's embedded DNS resolver (the kind network's gateway IP, stable
# for this project's local `tenant-lab` cluster) — CoreDNS still forwards genuine external
# lookups through it, they just don't get search-suffixed against an outside domain first.
nameserver 172.18.0.1
options ndots:5
